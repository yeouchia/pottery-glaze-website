   <script>
        function toggleMenu() {
            playClickSound();
            const menu = document.getElementById('navMenu');
            const icon = document.getElementById('menuIcon');
            menu.classList.toggle('active');
            if (menu.classList.contains('active')) {
                icon.className = "fa-solid fa-xmark";
                icon.style.transform = "rotate(90deg)";
                document.body.style.overflow = 'hidden';
            } else {
                icon.className = "fa-solid fa-bars";
                icon.style.transform = "rotate(0deg)";
                document.body.style.overflow = '';
            }
        }

        function toggleDropdown(id) {
            playClickSound();
            if (window.innerWidth <= 1250) {
                const target = document.getElementById(id);
                const isCurrentlyOpen = target.classList.contains('mobile-open');
                document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('mobile-open'));
                if (!isCurrentlyOpen) target.classList.add('mobile-open');
            }
        }

        function handleMobileClick(event) {
            playClickSound();
            if (window.innerWidth <= 1250) {
                const menu = document.getElementById('navMenu');
                const icon = document.getElementById('menuIcon');
                menu.classList.remove('active');
                icon.className = "fa-solid fa-bars";
                icon.style.transform = "rotate(0deg)";
                document.body.style.overflow = '';
                document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('mobile-open'));
            }
        }

        document.addEventListener('click', function(e) {
            const shareDropdown = document.getElementById('shareDropdown');
            const shareBtn = document.querySelector('.icon-btn.share');
            if (shareDropdown && !shareDropdown.contains(e.target) && !shareBtn.contains(e.target)) {
                shareDropdown.classList.remove('show');
            }
        });

        function toggleShareMenu(event) {
            event.stopPropagation();
            const menu = document.getElementById('shareDropdown');
            menu.classList.toggle('show');
        }

        function getSiteUrl() { return window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '/index.html'); }

        function shareToFB() {
            const siteMainUrl = getSiteUrl();
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            if (isMobile && navigator.share) {
                navigator.share({ title: '陶藝與釉藥調配', url: siteMainUrl }).catch((e) => {});
            } else {
                window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(siteMainUrl)}`, '_blank', 'width=600,height=400');
            }
            document.getElementById('shareDropdown').classList.remove('show');
        }

        function shareToLine() {
            const url = getSiteUrl();
            const textToShare = encodeURIComponent('推薦這個實用的陶藝與釉藥調配工具：\n' + url);
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            if (isMobile) {
                window.location.href = `https://line.me/R/msg/text/?${textToShare}`;
            } else {
                window.open(`https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(url)}`, '_blank', 'width=500,height=500');
            }
            document.getElementById('shareDropdown').classList.remove('show');
        }

        function copyLink() {
            navigator.clipboard.writeText(getSiteUrl()).then(() => {
                alert('✨ 網址已複製！快去分享給陶藝好友吧！');
            }).catch(() => {
                alert('複製失敗，請手動複製網址。');
            });
            document.getElementById('shareDropdown').classList.remove('show');
        }

        var hoverAudio = document.getElementById("hoverSound");
        var clickAudio = document.getElementById("clickSound");
        var bgMusic = document.getElementById("bgMusic");

        function unlockAudio() {
            if(hoverAudio) { hoverAudio.play().then(() => { hoverAudio.pause(); hoverAudio.currentTime = 0; }).catch((e) => {}); }
            if(clickAudio) { clickAudio.play().then(() => { clickAudio.pause(); clickAudio.currentTime = 0; }).catch((e) => {}); }
            if(bgMusic) { bgMusic.volume = 0.1; bgMusic.play().catch((e) => {}); }
            document.body.onclick = null;
        }

        function playHoverSound() {
            if (hoverAudio) {
                hoverAudio.currentTime = 0; hoverAudio.volume = 1.0;
                var p = hoverAudio.play();
                if (p !== undefined) { p.catch(() => {}); }
            }
        }

        function playClickSound() {
            if (clickAudio) {
                clickAudio.currentTime = 0; clickAudio.volume = 1.0;
                var p = clickAudio.play();
                if (p !== undefined) { p.catch(() => {}); }
            }
        }
    </script>
</body>
</html>
