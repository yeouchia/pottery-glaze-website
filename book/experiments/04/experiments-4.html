<style>
        :root { --primary-color: #14213d; --accent-color: #fca311; --text-main: #334155; --text-muted: #64748b; --bg-color: #ffffff; --content-width: 900px; }
        * { box-sizing: border-box; }
        
        /* 徹底鎖定網頁的水平滑動 */
        html, body { 
            font-family: 'Microsoft JhengHei', 'Segoe UI', Roboto, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            line-height: 1.7; 
            margin: 0; 
            padding: 0 20px 20px 20px; 
            -webkit-text-size-adjust: 100%; 
            width: 100%; 
            max-width: 100vw; 
            overflow-x: hidden; /* 隱藏 X 軸 */
        }
        
        .article-container { max-width: var(--content-width); margin: 40px auto 0 auto; overflow-x: hidden; }
        .article-header { margin-bottom: 35px; padding-bottom: 20px; border-bottom: 2px solid #f1f5f9; }
        .article-tag { display: inline-block; background-color: #fff8e7; color: #b45309; font-size: 0.85rem; font-weight: 700; padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(252, 163, 17, 0.2); margin-bottom: 15px; }
        .article-title { font-size: 1.85rem; font-weight: 800; color: var(--primary-color); margin: 0 0 15px 0; line-height: 1.35; }
        .article-meta { font-size: 0.95rem; color: var(--text-muted); display: flex; align-items: center; gap: 15px; font-weight: 600; }
        .article-meta i { color: var(--accent-color); }
        .article-content h2 { font-size: 1.35rem; font-weight: 800; color: var(--primary-color); margin: 45px 0 20px 0; padding-left: 12px; border-left: 5px solid var(--accent-color); line-height: 1.4; }
        .article-content p { font-size: 1.05rem; margin-bottom: 20px; text-align: justify; word-break: break-word; }
        
        /* 確保 figure 不會超出網格邊界 */
        figure { margin: 35px 0; background: #f8fafc; border-radius: 12px; overflow: hidden; border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(0,0,0,0.03); max-width: 100%; min-width: 0; }
        figure img { width: 100%; height: auto; display: block; transition: transform 0.3s ease; }
        figure:hover img { transform: scale(1.02); }
        
        /* 讓圖說內的長字串（如配方比例）允許自動斷行 */
        figcaption { padding: 14px 15px; font-size: 0.95rem; font-weight: 700; color: #475569; text-align: center; background: #f1f5f9; border-top: 1px solid #e2e8f0; word-wrap: break-word; overflow-wrap: anywhere; }
        figcaption i { color: var(--accent-color); margin-right: 6px; }
        
        .image-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 35px 0; }
        .image-grid-2 figure { margin: 0; min-width: 0; }
        .tile-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 30px 0; }
        .tile-grid figure { margin: 0; min-width: 0; }
        .tile-grid figcaption { padding: 10px; font-size: 0.9rem; }
        
        .info-box { background-color: #ebf8ff; border-left: 4px solid #3182ce; padding: 20px; border-radius: 0 8px 8px 0; margin: 25px 0; font-size: 1rem; color: #2b6cb0; line-height: 1.6; word-break: break-word; }
        .info-box strong { color: #2c5282; font-size: 1.1rem; display: block; margin-bottom: 12px; }
        .info-box ul { margin: 0; padding-left: 20px; }
        .info-box li { margin-bottom: 10px; }
        
        .site-footer-link { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 40px; margin-bottom: 20px; padding-top: 20px; border-top: 1px solid #e2e8f0; }
        .site-footer-link a.home-link { font-size: 0.8rem; color: var(--text-muted); text-decoration: none; transition: color 0.2s ease; }
        .site-footer-link a.home-link:hover { color: var(--accent-color); }
        
        .footer-share-wrapper { position: relative; display: inline-block; }
        .footer-share-btn { background: none; border: none; color: var(--text-muted); font-size: 1.1rem; cursor: pointer; padding: 5px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; }
        .footer-share-btn:hover { color: var(--accent-color); background-color: rgba(252, 163, 17, 0.1); transform: scale(1.1); }
        .share-dropdown-content { visibility: hidden; opacity: 0; transform: translateY(10px) translateX(-50%); position: absolute; bottom: 100%; left: 50%; margin-bottom: 10px; background-color: #ffffff; min-width: 150px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); border-radius: 8px; border: 1px solid rgba(0,0,0,0.08); z-index: 9999; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .share-dropdown-content.show { visibility: visible; opacity: 1; transform: translateY(0) translateX(-50%); }
        .share-dropdown-item { color: #334155; padding: 12px 16px; text-decoration: none; display: flex; align-items: center; gap: 12px; font-size: 0.9rem; font-weight: 700; transition: background-color 0.2s ease; border-bottom: 1px solid #f1f5f9; }
        .share-dropdown-item:last-child { border-bottom: none; }
        .share-dropdown-item:hover { background-color: #f8fafc; color: var(--accent-color); }
        
        @media (max-width: 768px) { 
            body { padding: 0 10px 20px 10px; }
            .article-container { width: 100%; max-width: 100%; margin: 20px auto 0 auto; overflow-x: hidden; }
            .article-title { font-size: 1.5rem; } 
            .article-content p { font-size: 1rem; } 
            .image-grid-2 { grid-template-columns: 1fr; gap: 15px; margin: 20px 0; } 
            .tile-grid { grid-template-columns: 1fr 1fr; gap: 10px; } /* 微調手機版雙排間距避免過擠 */
            .site-footer-link a.home-link { font-size: 0.75rem; } 
        }
    </style>
