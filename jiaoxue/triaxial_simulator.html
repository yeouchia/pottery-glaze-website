    <style>

<body>

<div class="container">
    <div class="left-panel">
        <h3 class="plot-title">三角座標圖 (Ternary Plot)</h3>
        <canvas id="ternaryCanvas" width="500" height="350"></canvas> 
        <div style="margin-top: -10px; font-weight: bold; font-size: 1em; margin-bottom: 4px;">
            當前配比：
            <span class="color-a" id="lbl-a-val">100</span>% | 
            <span class="color-b" id="lbl-b-val">0</span>% | 
            <span class="color-c" id="lbl-c-val">0</span>%
        </div>

        <div class="controls-section">
            <div class="step-selector">
                <strong>移動單位：</strong>
                <label><input type="radio" name="step" value="1"> 1% (自訂)</label>
                <label><input type="radio" name="step" value="5-full"> 5% (完整配方)</label>
                <label><input type="radio" name="step" value="5-half" checked> 5% (66個配方)</label>
                <label><input type="radio" name="step" value="10"> 10% (54個配方)</label>
            </div>

            <!-- HTML 內的 <option> 已經全部移除，改由 JS 自動寫入 -->
            <div class="slider-group bg-a">
                <select id="sel-a" class="color-a material-select" onchange="updateMaterialNames()"></select>
                <input type="range" id="slider-a" min="50" max="100" value="100" step="5">
                <div class="value-display color-a" id="val-a">100%</div>
                <button class="lock-btn" id="lock-a" onclick="toggleLock('a')">🔓 未鎖定</button>
            </div>

            <div class="slider-group bg-b">
                <select id="sel-b" class="color-b material-select" onchange="updateMaterialNames()"></select>
                <input type="range" id="slider-b" min="0" max="50" value="0" step="5">
                <div class="value-display color-b" id="val-b">0%</div>
                <button class="lock-btn" id="lock-b" onclick="toggleLock('b')">🔓 未鎖定</button>
            </div>

            <div class="slider-group bg-c">
                <select id="sel-c" class="color-c material-select" onchange="updateMaterialNames()"></select>
                <input type="range" id="slider-c" min="0" max="50" value="0" step="5">
                <div class="value-display color-c" id="val-c">0%</div>
                <button class="lock-btn" id="lock-c" onclick="toggleLock('c')">🔓 未鎖定</button>
            </div>
        </div>
    </div>

    <div class="right-panel">
        <div class="table-header-container">
            <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                <h3 id="table-title" style="margin: 0; font-size: 1.1em;">配方表 (66 個配方)</h3>
                <div id="sum-scale-selector" style="display: flex; gap: 8px; font-size: 12px; align-items: center; background: #f8f9fa; padding: 3px 8px; border-radius: 4px; border: 1px solid #ddd;">
                    <span style="font-weight: bold; color: #555;">總和：</span>
                    <label style="cursor: pointer;"><input type="radio" name="sumScale" value="100" checked> 百分百 (100)</label>
                    <label style="cursor: pointer;"><input type="radio" name="sumScale" value="50"> 百分之50</label>
                    <label style="cursor: pointer;"><input type="radio" name="sumScale" value="33.333333333333336"> 百分之33</label>
                </div>
            </div>
            <button class="copy-btn" onclick="copyTableToWord()">複製配方表 (Word格式)</button>
        </div>
        <div style="font-size: 11.5px; color: #7f8c8d; margin-bottom: 0px;" id="table-hint">
            💡 提示：系統已優化防呆邏輯。10%模式最低 A=10%，5%模式(66配方)最低 A=50%。
        </div>
        <div class="table-scroll-area">
            <div id="visual-tables-container" class="multi-table-container"></div>
        </div>
        <div style="text-align: right; padding-top: 10px; margin-top: auto; border-top: 1px dashed #eee;">
            <a href="https://pottery-glaze.vercel.app/" target="_parent" class="footer-link">
                陶藝與釉藥調配網站 | Pottery & Glaze Knowledge Base by 黃明文 2026
            </a>
        </div>
    </div>
</div>
