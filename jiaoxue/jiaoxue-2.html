        const rawRows = rawDataStr.trim().split('\n');
        let parsedData = rawRows.map(row => {
            const [mw, name, formula, cat, oxides, level, note] = row.split('|');
            return { mw, name, formula, cat, oxides, level, note };
        });

        const strokeCollator = new Intl.Collator('zh-TW', { collation: 'stroke' });
        parsedData.sort((a, b) => strokeCollator.compare(a.name, b.name));

        const tableBody = document.getElementById('table-body');
        const htmlRows = parsedData.map(item => {
            const mwDisplay = item.mw === '-' ? '<span class="text-muted">-</span>' : item.mw;
            const formattedFormula = item.formula.replace(/(\d+)/g, '<sub>$1</sub>');
            
            const oxideBadges = item.oxides.split(',').filter(o => o.trim() !== '-').map(o => 
                `<span class="badge-oxide">${o.trim().replace(/(\d+)/g, '<sub>$1</sub>')}</span>`
            ).join(' ');

            const levelClass = item.level.includes('A') ? 'level-A' 
                             : item.level.includes('B') ? 'level-B' 
                             : item.level.includes('C') ? 'level-C' 
                             : item.level.includes('D') ? 'level-D' 
                             : item.level.includes('E' ) ? 'level-E' : '';

            return `
                <tr>
                    <td class="fw-bold" style="color: var(--primary-accent);">${item.name}</td>
                    <td class="font-monospace text-secondary" style="font-size: 1.05rem;">${formattedFormula}</td>
                    <td class="font-monospace fw-semibold">${mwDisplay}</td>
                    <td><span class="badge-cat">${item.cat}</span></td>
                    <td>${oxideBadges}</td>
                    <td><span class="badge-level ${levelClass}">${item.level}</span></td>
                    <td class="small text-secondary">${item.note}</td>
                </tr>
            `;
        }).join('');

        tableBody.innerHTML = htmlRows;

        $(document).ready(function() {
            var table = $('#materialTable').DataTable({
                "language": {
                    "search": "全表快速搜尋：",
                    "lengthMenu": "每頁顯示 _MENU_ 筆",
                    "zeroRecords": "查無符合條件的原料",
                    "info": "顯示第 _START_ 至 _END_ 筆，總計 _TOTAL_ 筆",
                    "infoEmpty": "無可用資料",
                    "infoFiltered": "(從 _MAX_ 筆資料中篩選)",
                    "paginate": { "first": "首頁", "previous": "上一頁", "next": "下一頁", "last": "末頁" }
                },
                "pageLength": 100,
                "lengthMenu": [15, 25, 50, 100, 200],
                "order": [] 
            });

            $('#filterCategory').on('change', function() {
                var val = $.fn.dataTable.util.escapeRegex($(this).val());
                table.column(3).search(val ? '^' + val + '.*' : '', true, false).draw();
            });

            $('#filterLevel').on('change', function() {
                var val = $.fn.dataTable.util.escapeRegex($(this).val());
                table.column(5).search(val ? val : '', true, false).draw();
            });
        });
    </script>
</body>
