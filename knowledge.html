<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>陶藝知識庫 - 陶藝與釉藥調配</title>
    
    <!-- 👇 補上給搜尋引擎看的專屬描述 👇 -->
    <meta name="description" content="黃明文老師的陶藝知識庫與線上專論中心。完整收錄陶瓷歷史、成型技法、釉藥基礎三大元素、燒窯知識與疑難雜症解答，陪伴您從初學者邁向專業陶藝之路。">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 引入知識庫大腦 (分類與標籤資料) -->
    <script src="./assets/js/knowledge-data.js"></script>

    <style>
        :root {
            --primary-bg: #14213d;
            --accent-color: #fca311;
            --sidebar-bg: #f8f9fa;
            --border-color: #e2e8f0;
            --text-main: #2d3748;
            --text-muted: #718096;
            --active-bg: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100%;
            font-family: 'Microsoft JhengHei', 'Segoe UI', Roboto, sans-serif;
            color: var(--text-main); display: flex; overflow: hidden;
            -webkit-text-size-adjust: 100%;
        }

        /* === 左側動態目錄側邊欄 === */
        #sidebar {
            width: 330px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0; z-index: 10;
        }
        #sidebar.collapsed { margin-left: -330px; }

        .sidebar-header {
            padding: 18px 20px; background-color: #ffffff; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
        }
        .sidebar-header h3 { font-size: 1.1rem; color: var(--primary-bg); display: flex; align-items: center; gap: 10px; }
        
        .close-sidebar-mobile {
            background: none; border: none; font-size: 1.3rem; color: var(--primary-bg);
            cursor: pointer; display: none; border-radius: 4px; padding: 4px;
        }

        .sidebar-content { flex: 1; overflow-y: auto; padding: 15px 10px; }

        .category-group { margin-bottom: 8px; }
        .category-title {
            font-weight: bold; font-size: 1rem; padding: 12px; border-radius: 6px;
            color: var(--primary-bg); background-color: transparent; display: flex; 
            align-items: center; gap: 10px; cursor: pointer; transition: background 0.2s;
            border: 1px solid transparent;
        }
        .category-title:hover { background-color: var(--active-bg); }
        .category-title:hover i:first-child { color: var(--accent-color); }
        .category-title i:first-child { color: var(--accent-color); font-size: 1.15em; width: 24px; text-align: center; transition: all 0.3s ease; }
        .category-title i.toggle-icon { margin-left: auto; font-size: 0.8rem; transition: transform 0.3s; color: var(--text-muted); }
        .category-group.open .category-title { background-color: #edf2f7; border-color: #cbd5e1; }
        .category-group.open .category-title i.toggle-icon { transform: rotate(180deg); }

        @keyframes icon-shake-pop {
            0% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.3) rotate(-15deg); }
            50% { transform: scale(1.3) rotate(15deg); }
            75% { transform: scale(1.3) rotate(-15deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        /* 智慧四色循環 */
        .category-group:nth-child(4n+1).active-category .category-title { background-color: #fff5f5 !important; border-color: #fc8181 !important; color: #c53030 !important; }
        .category-group:nth-child(4n+1).active-category .category-title i:first-child, .category-group:nth-child(4n+1).active-category .category-title i.toggle-icon { color: #e53e3e !important; animation: icon-shake-pop 0.5s ease-out; }
        .category-group:nth-child(4n+1) .article-item.active { border-left-color: #e53e3e !important; background-color: #fff5f5; color: #c53030; }

        .category-group:nth-child(4n+2).active-category .category-title { background-color: #ebf8ff !important; border-color: #63b3ed !important; color: #2b6cb0 !important; }
        .category-group:nth-child(4n+2).active-category .category-title i:first-child, .category-group:nth-child(4n+2).active-category .category-title i.toggle-icon { color: #3182ce !important; animation: icon-shake-pop 0.5s ease-out; }
        .category-group:nth-child(4n+2) .article-item.active { border-left-color: #3182ce !important; background-color: #ebf8ff; color: #2b6cb0; }

        .category-group:nth-child(4n+3).active-category .category-title { background-color: #f0fff4 !important; border-color: #68d391 !important; color: #2f855a !important; }
        .category-group:nth-child(4n+3).active-category .category-title i:first-child, .category-group:nth-child(4n+3).active-category .category-title i.toggle-icon { color: #38a169 !important; animation: icon-shake-pop 0.5s ease-out; }
        .category-group:nth-child(4n+3) .article-item.active { border-left-color: #38a169 !important; background-color: #f0fff4; color: #2f855a; }

        .category-group:nth-child(4n+4).active-category .category-title { background-color: #faf5ff !important; border-color: #b794f4 !important; color: #6b46c1 !important; }
        .category-group:nth-child(4n+4).active-category .category-title i:first-child, .category-group:nth-child(4n+4).active-category .category-title i.toggle-icon { color: #805ad5 !important; animation: icon-shake-pop 0.5s ease-out; }
        .category-group:nth-child(4n+4) .article-item.active { border-left-color: #805ad5 !important; background-color: #faf5ff; color: #6b46c1; }

        /* === 兩層式樹狀目錄結構樣式 === */
        .category-content { display: none; flex-direction: column; gap: 4px; padding-top: 4px; }
        .category-group.open .category-content { display: flex; }

        .sub-category-group { margin: 2px 0 2px 18px; border-left: 2px solid #e2e8f0; padding-left: 6px; }
        .sub-category-title {
            font-size: 0.95rem; padding: 8px 12px; border-radius: 4px; font-weight: 500;
            color: #475569; display: flex; align-items: center; gap: 8px;
            cursor: pointer; transition: all 0.2s;
        }
        .sub-category-title:hover { background-color: #f1f5f9; color: var(--primary-bg); }
        .sub-category-title i.fa-folder, .sub-category-title i.fa-folder-open { color: var(--accent-color); font-size: 1.1em; }
        .sub-category-title i.toggle-icon { margin-left: auto; font-size: 0.75rem; transition: transform 0.3s; color: var(--text-muted); }
        
        .sub-category-group.open > .sub-category-title { color: var(--primary-bg); font-weight: bold; }
        .sub-category-group.open > .sub-category-title i.toggle-icon { transform: rotate(180deg); }
        .sub-category-group.open > .sub-category-title i.fa-folder::before { content: "\f07c"; } /* 切換為打開的資料夾圖示 */

        .article-list { list-style: none; display: flex; flex-direction: column; gap: 2px; }
        
        /* 次級資料夾內的文章列表預設隱藏 */
        .sub-category-group .article-list { display: none; padding-left: 8px; margin-top: 4px; margin-bottom: 6px; }
        .sub-category-group.open .article-list { display: flex; }

        /* 直接在主分類下的文章列表 (沒有次級資料夾時) */
        .category-content > .article-list { padding-left: 24px; margin-top: 2px; }

        .article-item-container { display: block; }
        
        .article-item {
            display: block; padding: 10px 12px; font-size: 0.95rem; color: #334155; font-weight: 500;
            text-decoration: none; border-radius: 4px; transition: all 0.2s; cursor: pointer; line-height: 1.4; border-left: 4px solid transparent;
        }
        .article-item:hover { color: var(--primary-bg); background-color: #f1f5f9; padding-left: 16px; }
        
        .sub-topic-list { list-style: none; padding-left: 16px; margin-top: 4px; margin-bottom: 8px; display: none; }
        .article-item-container.has-subs.active-parent .sub-topic-list { display: block; }
        
        .sub-topic-item {
            display: block; padding: 6px 10px 6px 20px; font-size: 0.85rem; color: #64748b;
            text-decoration: none; border-radius: 4px; transition: all 0.2s; cursor: pointer; position: relative;
        }
        .sub-topic-item::before { content: ""; position: absolute; left: 6px; top: 14px; width: 4px; height: 4px; border-radius: 50%; background-color: #cbd5e1; transition: all 0.2s; }
        .sub-topic-item:hover { color: #0f172a; background-color: rgba(0,0,0,0.03); }

        #main-content { flex: 1; width: 100%; display: flex; flex-direction: column; height: 100vh; overflow: hidden; background-color: #ffffff; }

        .top-toolbar {
            height: 52px; border-bottom: 1px solid var(--border-color); display: flex;
            align-items: center; padding: 0 20px; background-color: #ffffff; flex-shrink: 0;
        }

        .toggle-btn {
            background: #edf2f7; border: none; color: var(--primary-bg); padding: 8px 14px;
            border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: bold;
            display: flex; align-items: center; gap: 6px; transition: all 0.2s;
        }
        .toggle-btn:hover { background: var(--primary-bg); color: #ffffff; }
        .current-path { margin-left: 15px; font-size: 0.9rem; color: var(--text-muted); font-weight: bold; }

        .reader-body { flex: 1; width: 100%; border: none; background-color: #fff; }

        @media (max-width: 1000px) {
            #sidebar { position: absolute; height: 100%; width: 85vw; max-width: 350px; box-shadow: 4px 0 25px rgba(0,0,0,0.2); }
            #sidebar.collapsed { margin-left: -100%; }
            .close-sidebar-mobile { display: block; }
            .current-path { display: none; }
        }
    </style>
</head>
<body>

    <aside id="sidebar" class="collapsed">
        <div class="sidebar-header">
            <h3><i class="fa-solid fa-book-journal-whills" style="color: var(--accent-color);"></i> 陶藝知識庫</h3>
            <button class="close-sidebar-mobile" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="sidebar-content" id="sidebar-content"></div>
    </aside>

    <main id="main-content">
        <div class="top-toolbar">
            <button class="toggle-btn" onclick="toggleSidebar()">
                <i class="fa-solid fa-bars-staggered"></i> <span id="toggleText">開啟目錄</span>
            </button>
            <div class="current-path" id="current-path">請從左側選擇文章</div>
        </div>
        <iframe id="articleFrame" class="reader-body" src=""></iframe>
    </main>

    <script>
        function getTargetArticleId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('article');
        }

        // --- 核心：動態生成側邊欄樹狀目錄 (升級兩層式折疊) ---
        function renderSidebar() {
            const container = document.getElementById('sidebar-content');
            container.innerHTML = '';

            knowledgeTree.forEach((group) => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'category-group';

                const titleDiv = document.createElement('div');
                titleDiv.className = 'category-title';
                titleDiv.innerHTML = `<i class="fa-solid ${group.icon}"></i> ${group.category} <i class="fa-solid fa-chevron-down toggle-icon"></i>`;
                
                titleDiv.onclick = () => {
                    document.querySelectorAll('.category-group').forEach(g => {
                        if(g !== groupDiv) g.classList.remove('open');
                    });
                    groupDiv.classList.toggle('open');
                    document.querySelectorAll('.category-group').forEach(g => g.classList.remove('active-category'));
                    if (groupDiv.classList.contains('open')) {
                        groupDiv.classList.add('active-category');
                    }
                };

                const contentContainer = document.createElement('div');
                contentContainer.className = 'category-content';

                const articlesToRender = group.articles;
                const uniqueTags = [...new Set(articlesToRender.map(a => a.tag || '未分類'))];

                // 如果該主分類下的標籤大於 1 個，則啟動「次級資料夾」模式
                if (uniqueTags.length > 1) {
                    uniqueTags.forEach(tag => {
                        const subGroupDiv = document.createElement('div');
                        subGroupDiv.className = 'sub-category-group';

                        const subTitleDiv = document.createElement('div');
                        subTitleDiv.className = 'sub-category-title';
                        subTitleDiv.innerHTML = `<i class="fa-solid fa-folder"></i> ${tag} <i class="fa-solid fa-chevron-down toggle-icon"></i>`;

                        const subListUl = document.createElement('ul');
                        subListUl.className = 'article-list';

                        subTitleDiv.onclick = (e) => {
                            e.stopPropagation(); // 防止點擊事件往上傳遞觸發主分類折疊
                            subGroupDiv.classList.toggle('open');
                        };

                        const articlesInTag = articlesToRender.filter(a => (a.tag || '未分類') === tag);
                        articlesInTag.forEach(article => {
                            subListUl.appendChild(createArticleItem(article, group.category));
                        });

                        subGroupDiv.appendChild(subTitleDiv);
                        subGroupDiv.appendChild(subListUl);
                        contentContainer.appendChild(subGroupDiv);
                    });
                } else {
                    // 若無標籤或只有 1 個標籤，則直接渲染文章列表 (向下相容)
                    const directListUl = document.createElement('ul');
                    directListUl.className = 'article-list';
                    articlesToRender.forEach(article => {
                        directListUl.appendChild(createArticleItem(article, group.category));
                    });
                    contentContainer.appendChild(directListUl);
                }

                groupDiv.appendChild(titleDiv);
                groupDiv.appendChild(contentContainer);
                container.appendChild(groupDiv);
            });
        }

        // --- 輔助：生成單筆文章項目的 DOM ---
        function createArticleItem(article, categoryName) {
            const itemContainerLi = document.createElement('li');
            itemContainerLi.className = 'article-item-container';
            
            if (article.subTopics && article.subTopics.length > 0) {
                itemContainerLi.classList.add('has-subs');
            }

            const itemLi = document.createElement('div');
            itemLi.className = 'article-item';
            itemLi.dataset.id = article.id;
            itemLi.textContent = article.title;
            
            itemLi.onclick = (e) => {
                e.stopPropagation();
                loadArticle(article.url, article.id, categoryName, article.title, null);
                if(window.innerWidth <= 1000) toggleSidebar(); 
            };
            itemContainerLi.appendChild(itemLi);

            // 渲染內文子標題 (錨點)
            if (article.subTopics && article.subTopics.length > 0) {
                const subUl = document.createElement('ul');
                subUl.className = 'sub-topic-list';
                article.subTopics.forEach(sub => {
                    const subLi = document.createElement('li');
                    subLi.className = 'sub-topic-item';
                    subLi.textContent = sub.title;
                    subLi.onclick = (e) => {
                        e.stopPropagation();
                        loadArticle(article.url, article.id, categoryName, article.title, sub.id);
                        if(window.innerWidth <= 1000) toggleSidebar(); 
                    };
                    subUl.appendChild(subLi);
                });
                itemContainerLi.appendChild(subUl);
            }
            return itemContainerLi;
        }

        // --- 載入文章與更新介面狀態 ---
        function loadArticle(url, id, category, title, anchorId) {
            const iframe = document.getElementById('articleFrame');
            const targetUrl = anchorId ? `${url}#${anchorId}` : url;
            const currentSrc = iframe.src.split('#')[0];
            const newSrc = new URL(url, window.location.href).href;

            if (currentSrc !== newSrc) {
                iframe.src = targetUrl;
            } else if (anchorId) {
                iframe.contentWindow.location.replace(targetUrl);
            }
            
            document.getElementById('current-path').innerHTML = `<span style="color: var(--accent-color);">${category}</span> <i class="fa-solid fa-angle-right" style="margin: 0 8px; font-size: 0.8em;"></i> ${title}`;

            // 重置所有選取狀態
            document.querySelectorAll('.article-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.article-item-container').forEach(el => el.classList.remove('active-parent'));
            document.querySelectorAll('.category-group').forEach(group => group.classList.remove('active-category'));

            const activeItem = document.querySelector(`.article-item[data-id="${id}"]`);
            if(activeItem) {
                activeItem.classList.add('active');
                
                const itemContainer = activeItem.closest('.article-item-container');
                if(itemContainer) itemContainer.classList.add('active-parent');
                
                // 自動展開所屬的次級資料夾 (若有)
                const subGroup = activeItem.closest('.sub-category-group');
                if(subGroup) subGroup.classList.add('open');

                // 自動展開所屬的主分類
                const parentGroup = activeItem.closest('.category-group');
                if(parentGroup) {
                    parentGroup.classList.add('active-category');
                    parentGroup.classList.add('open'); 
                }
            }
        }

        // --- 處理網址參數與動態展開 (優化平滑滾動) ---
        function handleUrlParams() {
            const targetId = getTargetArticleId();
            const urlParams = new URLSearchParams(window.location.search);
            const targetCatKey = urlParams.get('cat');

            // 無論如何，先保證側邊欄完整渲染出來
            renderSidebar();

            if (targetId) {
                const articleData = findArticleById(targetId);
                if (articleData) {
                    loadArticle(articleData.url, articleData.id, articleData.category, articleData.title, null);
                    
                    setTimeout(() => {
                        const foundItem = document.querySelector(`.article-item[data-id="${targetId}"]`);
                        if (foundItem) {
                            // 滾動到特定文章的位置 (畫面置中)
                            foundItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }, 100);
                    return;
                }
            }

            if (targetCatKey) {
                const catMap = {
                    'intro': 0, 'shaping': 1, 'skills': 2, 'glaze': 3, 'firing': 4, 'experiments': 5, 'lecture': 6
                };
                const groupIndex = catMap[targetCatKey];
                if (groupIndex !== undefined) {
                    setTimeout(() => {
                        const groupDivs = document.querySelectorAll('.category-group');
                        if (groupDivs[groupIndex]) {
                            groupDivs.forEach(g => { g.classList.remove('open'); g.classList.remove('active-category'); });
                            groupDivs[groupIndex].classList.add('open');
                            groupDivs[groupIndex].classList.add('active-category');
                            
                            const targetTitle = groupDivs[groupIndex].querySelector('.category-title');
                            if (targetTitle) targetTitle.scrollIntoView({ behavior: 'smooth', block: 'start' });
                            
                            // 同時自動載入該分類的第一篇文章
                            const firstArtItem = groupDivs[groupIndex].querySelector('.article-item');
                            if (firstArtItem) {
                                firstArtItem.click();
                            }
                        }
                    }, 100);
                    return;
                }
            }

            // 預設載入第一篇
            const firstArticle = knowledgeTree[0].articles[0];
            if(firstArticle) loadArticle(firstArticle.url, firstArticle.id, knowledgeTree[0].category, firstArticle.title, null);
        }

        function findArticleById(id) {
            for (const group of knowledgeTree) {
                const found = group.articles.find(a => a.id === id);
                if (found) {
                    return { ...found, category: group.category };
                }
            }
            return null;
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const toggleText = document.getElementById('toggleText');
            sidebar.classList.toggle('collapsed');
            toggleText.textContent = sidebar.classList.contains('collapsed') ? '開啟目錄' : '關閉目錄';
        }

        window.addEventListener('DOMContentLoaded', () => {
            handleUrlParams();
            if(window.innerWidth > 1000) {
                document.getElementById('sidebar').classList.remove('collapsed');
                document.getElementById('toggleText').textContent = '關閉目錄';
            }
        });
    </script>
</body>
</html>
