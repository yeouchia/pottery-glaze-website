<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業影像工坊 Pro v2.1.1 (雙軌穩定版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1a1a1a; color: #e5e5e5; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #2d2d2d; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #777; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; height: 4px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%; background: #60a5fa; cursor: pointer; margin-top: -5px; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #404040; border-radius: 2px; }
        
        .layout-container { display: flex; height: 100vh; overflow: hidden; }
        .canvas-section { flex: 1; display: flex; justify-content: center; align-items: center; background-color: #111; position: relative; overflow: hidden; }
        .control-section { width: 340px; background-color: #262626; border-left: 1px solid #404040; display: flex; flex-direction: column; overflow-y: auto; padding: 12px; gap: 10px; font-size: 12px; }
        
        .panel { background-color: #333; padding: 10px; border-radius: 8px; border: 1px solid #404040; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .panel-title { font-size: 12px; font-weight: bold; color: #a3a3a3; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .btn { padding: 6px 10px; border-radius: 5px; font-weight: 500; cursor: pointer; transition: all 0.2s; border: none; font-size: 11px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; user-select: none;}
        .btn:active { transform: scale(0.96); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background-color: #3b82f6; color: white; }
        .btn-primary:hover { background-color: #2563eb; }
        .btn-success { background-color: #10b981; color: white; }
        .btn-success:hover { background-color: #059669; }
        .btn-danger { background-color: #ef4444; color: white; }
        .btn-outline { background-color: #404040; color: #e5e5e5; border: 1px solid #4b5563; }
        .btn-outline:hover { background-color: #525252; }
        .btn-active { background-color: #3b82f6; color: white; box-shadow: 0 0 8px rgba(59,130,246,0.5); border-color: #2563eb; }
        
        .filter-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .slider-group { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
        .slider-label { width: 65px; color: #d4d4d4; font-size: 11px; }
        .slider-ctrl { flex: 1; display: flex; align-items: center; gap: 4px; }
        .slider-val { width: 25px; text-align: right; color: #9ca3af; font-family: monospace; font-size: 11px; }
        .arrow-btn { background: #404040; border: none; color: #e5e5e5; cursor: pointer; font-size: 10px; padding: 3px 6px; border-radius: 3px; }
        .arrow-btn:hover { background: #525252; color: #fff; }

        .color-tabs { display: flex; gap: 2px; margin-bottom: 8px; background: #262626; padding: 2px; border-radius: 6px; }
        .tab-btn { flex: 1; text-align: center; padding: 4px 0; border-radius: 4px; cursor: pointer; color: #a3a3a3; transition: 0.2s; font-size: 11px; }
        .tab-btn.active { background: #404040; color: white; font-weight: bold; box-shadow: inset 0 0 5px rgba(0,0,0,0.5); }
        #canvas { max-width: 100%; max-height: 100%; object-fit: contain; box-shadow: 0 4px 20px rgba(0,0,0,0.5); transition: transform 0.05s linear; transform-origin: center center; }
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #10b981; color: white; padding: 10px 20px; border-radius: 30px; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 1000; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        #loading-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.7); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
        .cursor-crosshair { cursor: crosshair !important; }
        .cursor-heal { cursor: crosshair !important; } 
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-white mb-4"></div>
        <div class="text-lg font-bold" id="loading-msg">高畫質運算中...</div>
    </div>

    <div class="layout-container">
        <!-- 畫布區 -->
        <div class="canvas-section" id="canvas-wrapper">
            <div id="img-info-badge" class="absolute top-4 left-4 bg-black/80 text-white px-3 py-1 rounded-md text-[11px] hidden z-10 shadow-lg border border-gray-600 pointer-events-none"></div>
            <canvas id="canvas" class="hidden"></canvas>
            <div id="placeholder" class="text-gray-500 text-sm flex flex-col items-center">
                <span class="text-5xl mb-3">📷</span>
                <span class="text-lg">點擊右側「載入照片」開始編輯</span>
                <span class="text-xs mt-2 text-gray-600">已啟用雙軌引擎 (支援高畫質無延遲編輯)</span>
            </div>
        </div>

        <!-- 功能區 -->
        <div class="control-section">
            <input type="file" id="file-input" accept="image/*" class="hidden">
            
            <div class="flex gap-2">
                <button id="upload-btn" class="btn btn-primary flex-1">📷 載入</button>
                <button id="set-dir-btn" class="btn btn-outline flex-1 truncate" title="設定資料夾">📂 設輸出夾</button>
                <button id="download-btn" class="btn btn-success flex-1" disabled>💾 存檔(高畫質)</button>
            </div>
            <div class="flex gap-2">
                <button id="compare-btn" class="btn btn-outline flex-1" disabled title="按住不放檢視原圖">👀 原圖(按住)</button>
                <button id="undo-btn" class="btn btn-outline flex-1" disabled title="返回上一步">↩ 返回 (0)</button>
                <button id="reset-all-btn" class="btn btn-danger" title="重設所有狀態">↺ 重設</button>
            </div>

            <!-- 工具列 -->
            <div class="panel">
                <div class="flex gap-2 w-full mb-2" id="normal-tools-1">
                    <button id="crop-btn" class="btn btn-outline flex-1" disabled>◩ 裁切</button>
                    <button id="heal-btn" class="btn btn-outline flex-1" disabled>🩹 污點修復</button>
                </div>
                <div class="flex gap-2 w-full" id="normal-tools-2">
                    <button id="rot-l-btn" class="btn btn-outline flex-1 px-1" disabled>↺ 左轉</button>
                    <button id="rot-r-btn" class="btn btn-outline flex-1 px-1" disabled>↻ 右轉</button>
                    <button id="flip-btn" class="btn btn-outline flex-1 px-1" disabled>↔ 鏡像</button>
                    <button id="zoom-in-btn" class="btn btn-outline flex-1 px-1" disabled>🔍 放大</button>
                    <button id="zoom-out-btn" class="btn btn-outline flex-1 px-1" disabled>🔍 縮小</button>
                </div>
                
                <div class="flex flex-col gap-2 hidden w-full mt-2 border-t border-[#404040] pt-2" id="crop-tools">
                    <div class="panel-title text-blue-400 mb-0">裁切模式</div>
                    <div class="flex gap-1">
                        <button class="btn btn-outline flex-1 crop-ratio text-[10px]" data-ratio="NaN">自由</button>
                        <button class="btn btn-outline flex-1 crop-ratio text-[10px]" data-ratio="1">1:1</button>
                        <button class="btn btn-outline flex-1 crop-ratio text-[10px]" data-ratio="1.333">4:3</button>
                        <button class="btn btn-outline flex-1 crop-ratio text-[10px]" data-ratio="1.777">16:9</button>
                        <button class="btn btn-outline flex-1 crop-ratio text-[10px]" data-ratio="0.5625">9:16</button>
                    </div>
                    <div class="flex gap-1 mt-1">
                        <button id="crop-apply" class="btn btn-success flex-1">✔ 確認裁切</button>
                        <button id="crop-cancel" class="btn btn-danger flex-1">✖ 取消</button>
                    </div>
                </div>

                <div class="flex flex-col gap-2 hidden w-full mt-2 border-t border-[#404040] pt-2" id="heal-tools">
                    <div class="panel-title text-pink-400 mb-0">污點修復模式 (點擊照片消除雜點)</div>
                    <div class="slider-group">
                        <div class="slider-label">畫筆大小</div>
                        <div class="slider-ctrl">
                            <input type="range" id="heal-size" min="5" max="100" value="20" oninput="document.getElementById('heal-size-val').innerText=this.value">
                        </div>
                        <div class="slider-val" id="heal-size-val">20</div>
                    </div>
                    <button id="heal-cancel" class="btn btn-outline w-full">✔ 退出修復模式</button>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">風格濾鏡</div>
                <div class="filter-grid">
                    <button class="btn btn-outline filter-btn btn-active" data-filter="normal">原圖</button>
                    <button class="btn btn-outline filter-btn" data-filter="glaze">釉光增強</button>
                    <button class="btn btn-outline filter-btn" data-filter="vibrant">色彩飽和</button>
                    <button class="btn btn-outline filter-btn" data-filter="sharpen">立體銳化</button>
                    <button class="btn btn-outline filter-btn" data-filter="vintage">復古窯燒</button>
                    <button class="btn btn-outline filter-btn" data-filter="glaze-spot">釉光聚光</button>
                    <button class="btn btn-outline filter-btn" data-filter="vib-spot">鮮彩聚光</button>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">
                    <div class="flex items-center gap-2">
                        <span>全域色彩微調</span>
                        <button id="wb-btn" class="btn btn-outline px-1 py-0 text-[10px] bg-[#4a4a4a]">🖌 白平衡</button>
                    </div>
                    <button id="reset-global-color" class="text-[#ef4444] text-[11px] hover:text-red-400">↺ 重設全域</button>
                </div>
                <div id="global-sliders"></div>
            </div>

            <div class="panel border-l-4 border-sky-500">
                <div class="panel-title">
                    <span class="text-sky-300 tracking-wide">局部精細遮罩 (6通道)</span>
                    <button id="reset-local-mask" class="text-[#ef4444] text-[11px] hover:text-red-400">↺ 重設遮罩</button>
                </div>
                <div class="color-tabs mb-2">
                    <div class="tab-btn local-mask-tab active" data-idx="0">A區</div>
                    <div class="tab-btn local-mask-tab" data-idx="1">B區</div>
                    <div class="tab-btn local-mask-tab" data-idx="2">C區</div>
                    <div class="tab-btn local-mask-tab" data-idx="3">D區</div>
                    <div class="tab-btn local-mask-tab" data-idx="4">E區</div>
                    <div class="tab-btn local-mask-tab" data-idx="5">F區</div>
                </div>
                <div class="flex flex-col gap-1 mb-2 border border-[#404040] rounded p-1">
                    <div class="flex gap-1">
                        <button class="btn btn-outline flex-1 local-type-btn px-0 py-1 text-[10px]" data-type="radial" title="圓形區域">⭕</button>
                        <button class="btn btn-outline flex-1 local-type-btn px-0 py-1 text-[10px]" data-type="rect" title="矩形區域">🔲</button>
                        <button class="btn btn-outline flex-1 local-type-btn px-0 py-1 text-[10px]" data-type="linear-t" title="由上往下">⬇</button>
                        <button class="btn btn-outline flex-1 local-type-btn px-0 py-1 text-[10px]" data-type="linear-b" title="由下往上">⬆</button>
                        <button class="btn btn-outline flex-1 local-type-btn px-0 py-1 text-[10px]" data-type="linear-l" title="由左往右">➡</button>
                        <button class="btn btn-outline flex-1 local-type-btn px-0 py-1 text-[10px]" data-type="linear-r" title="由右往左">⬅</button>
                    </div>
                    <div class="flex gap-1">
                        <button class="btn btn-outline flex-1 local-type-btn px-0 py-1 text-[10px]" data-type="linear-tl" title="左上到右下">↘</button>
                        <button class="btn btn-outline flex-1 local-type-btn px-0 py-1 text-[10px]" data-type="linear-tr" title="右上到左下">↙</button>
                        <button class="btn btn-outline flex-1 local-type-btn px-0 py-1 text-[10px]" data-type="linear-bl" title="左下到右上">↗</button>
                        <button class="btn btn-outline flex-1 local-type-btn px-0 py-1 text-[10px]" data-type="linear-br" title="右下到左上">↖</button>
                        <button id="toggle-local-track" class="btn btn-outline flex-[1.2] px-1 py-1 text-[10px] bg-blue-900/30 font-bold" title="在照片上顯示標靶並拖曳">📍 定位顯示(關)</button>
                    </div>
                </div>
                <div id="local-mask-sliders"></div>
            </div>

            <div class="panel border-l-4 border-purple-500 bg-[#2d2535]">
                <div class="panel-title">
                    <span class="text-purple-300 font-bold tracking-wide">景深特效 (反向背景保護圈)</span>
                </div>
                <div class="grid grid-cols-2 gap-1 mb-2">
                    <div class="tab-btn bgfx-tab-btn active flex flex-col justify-center gap-1 p-1 rounded-md" data-type="radialA">
                        <span class="text-[11px]">⭕ 圓形 A</span>
                        <label class="flex items-center justify-center gap-1 text-[10px] cursor-pointer"><input type="checkbox" id="bgfx-radialA-active" checked> 啟用</label>
                    </div>
                    <div class="tab-btn bgfx-tab-btn flex flex-col justify-center gap-1 p-1 rounded-md" data-type="radialB">
                        <span class="text-[11px]">⭕ 圓形 B</span>
                        <label class="flex items-center justify-center gap-1 text-[10px] cursor-pointer"><input type="checkbox" id="bgfx-radialB-active"> 啟用</label>
                    </div>
                    <div class="tab-btn bgfx-tab-btn flex flex-col justify-center gap-1 p-1 rounded-md" data-type="rectA">
                        <span class="text-[11px]">🔲 矩形 A</span>
                        <label class="flex items-center justify-center gap-1 text-[10px] cursor-pointer"><input type="checkbox" id="bgfx-rectA-active"> 啟用</label>
                    </div>
                    <div class="tab-btn bgfx-tab-btn flex flex-col justify-center gap-1 p-1 rounded-md" data-type="rectB">
                        <span class="text-[11px]">🔲 矩形 B</span>
                        <label class="flex items-center justify-center gap-1 text-[10px] cursor-pointer"><input type="checkbox" id="bgfx-rectB-active"> 啟用</label>
                    </div>
                </div>
                <button id="toggle-bgfx-track" class="btn btn-outline w-full mb-2 text-[10px] px-2 py-1 font-bold">📍 定位顯示(關)</button>
                <div class="text-[10px] text-gray-400 mb-2 leading-tight">提示：開啟「定位顯示」後，直接在照片上拖曳白色十字標靶即可移動位置。</div>
                <div id="bgfx-shape-sliders"></div>
                <div class="border-t border-purple-800 mt-2 pt-2" id="bgfx-global-sliders"></div>
            </div>

            <div class="panel">
                <div class="panel-title">
                    <span>單色精準控制：<span id="current-tab-name" class="text-red-400 text-[12px] font-bold">紅</span></span>
                    <button id="reset-specific-color" class="text-[#ef4444] text-[11px] hover:text-red-400">↺ 重設該色</button>
                </div>
                <div class="color-tabs">
                    <div class="tab-btn active" data-color="red" style="color:#f87171">紅</div>
                    <div class="tab-btn" data-color="orange" style="color:#fb923c">橙</div>
                    <div class="tab-btn" data-color="yellow" style="color:#facc15">黃</div>
                    <div class="tab-btn" data-color="green" style="color:#4ade80">綠</div>
                    <div class="tab-btn" data-color="cyan" style="color:#2dd4bf">青</div>
                    <div class="tab-btn" data-color="blue" style="color:#60a5fa">藍</div>
                    <div class="tab-btn" data-color="purple" style="color:#c084fc">紫</div>
                    <div class="tab-btn flex items-center justify-center text-[10px]" data-color="custom">吸管</div>
                </div>
                <div id="custom-color-picker" class="hidden mb-2 bg-[#2a2a2a] p-2 rounded-md flex flex-col gap-2 border border-gray-600">
                    <button id="eyedropper-btn" class="btn btn-outline w-full text-[11px]">🖌 點擊此處，再去照片上吸取顏色</button>
                    <div class="flex items-center justify-center gap-2 text-[11px] text-gray-300">
                        目標色: <div id="custom-color-preview" class="w-4 h-4 rounded shadow-sm bg-gray-500"></div>
                        色相 <span id="custom-hue-val" class="text-white font-mono">--</span>
                    </div>
                </div>
                <div id="specific-sliders"></div>
            </div>

            <div class="panel">
                <div class="panel-title">
                    <span class="text-emerald-400">自訂風格配方 (Presets)</span>
                    <button id="save-preset-btn" class="btn btn-success text-[10px] px-2 py-1">💾 儲存配方</button>
                </div>
                <div id="preset-list" class="flex flex-wrap gap-2 mt-2"></div>
            </div>
        </div>
    </div>
    
    <div id="toast">訊息</div>

    <script>
        const fileInput = document.getElementById('file-input');
        const uploadBtn = document.getElementById('upload-btn');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const canvasWrapper = document.getElementById('canvas-wrapper');
        const imgInfoBadge = document.getElementById('img-info-badge');
        const compareBtn = document.getElementById('compare-btn');
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingMsg = document.getElementById('loading-msg');
        
        let originalFullImage = null;   
        let originalProxyImage = null;  
        const PROXY_MAX_SIZE = 1200;    
        const EXPORT_MAX_SIZE = 4000;   

        let cropper = null; let isCropping = false; let isHealing = false; let targetDirHandle = null;
        let currentScale = 1; let panX = 0, panY = 0; let isDragging = false, hasDragged = false, dragStartX = 0, dragStartY = 0;

        // 視覺化定位模式狀態
        let isLocatingLocal = false;
        let isLocatingBgFx = false;
        let isDraggingLocation = false;

        let state = {
            filter: 'normal', wb: { r: 1, g: 1, b: 1, active: false },
            global: { hue: 0, sat: 0, light: 0, temp: 0, cont: 0 },
            localMasks: [
                { type: 'radial', temp: 0, light: 0, cont: 0, sharp: 0, size: 50, feather: 50, x: 0.5, y: 0.5 },
                { type: 'linear-t', temp: 0, light: 0, cont: 0, sharp: 0, size: 30, feather: 50, x: 0.5, y: 0.5 },
                { type: 'linear-b', temp: 0, light: 0, cont: 0, sharp: 0, size: 30, feather: 50, x: 0.5, y: 0.5 },
                { type: 'radial', temp: 0, light: 0, cont: 0, sharp: 0, size: 50, feather: 50, x: 0.5, y: 0.5 },
                { type: 'rect', temp: 0, light: 0, cont: 0, sharp: 0, size: 40, feather: 50, x: 0.5, y: 0.5 },
                { type: 'rect', temp: 0, light: 0, cont: 0, sharp: 0, size: 40, feather: 50, x: 0.5, y: 0.5 }
            ],
            activeLmIdx: 0,
            bgFx: {
                radialA: { active: true, x: 0.5, y: 0.5, w: 35, h: 35 }, radialB: { active: false, x: 0.5, y: 0.5, w: 35, h: 35 },
                rectA: { active: false, x: 0.5, y: 0.5, w: 35, h: 35 }, rectB: { active: false, x: 0.5, y: 0.5, w: 35, h: 35 },
                feather: 30, blur: 0, zoom: 0, lightness: 0, saturation: 0, activeTab: 'radialA'
            },
            colors: {
                red: { h: 0, s: 0, l: 0 }, orange: { h: 0, s: 0, l: 0 }, yellow: { h: 0, s: 0, l: 0 }, green: { h: 0, s: 0, l: 0 },
                cyan: { h: 0, s: 0, l: 0 }, blue: { h: 0, s: 0, l: 0 }, purple: { h: 0, s: 0, l: 0 }, custom: { baseH: 0, h: 0, s: 0, l: 0, active: false }
            },
            activeTab: 'red', pickingColor: false, pickingWb: false
        };

        function migrateState(s) {
            if(!s.localMasks[4]) s.localMasks.push({ type: 'rect', temp: 0, light: 0, cont: 0, sharp: 0, size: 40, feather: 50, x: 0.5, y: 0.5 });
            if(!s.localMasks[5]) s.localMasks.push({ type: 'rect', temp: 0, light: 0, cont: 0, sharp: 0, size: 40, feather: 50, x: 0.5, y: 0.5 });
            if (s.bgFx && s.bgFx.type) {
                const o = s.bgFx.type;
                s.bgFx = { radialA: { active: o === 'radial', x: s.bgFx.x||0.5, y: s.bgFx.y||0.5, w: s.bgFx.w||35, h: s.bgFx.h||35 }, radialB: { active: false, x: 0.5, y: 0.5, w: 35, h: 35 }, rectA: { active: o === 'rect', x: s.bgFx.x||0.5, y: s.bgFx.y||0.5, w: s.bgFx.w||35, h: s.bgFx.h||35 }, rectB: { active: false, x: 0.5, y: 0.5, w: 35, h: 35 }, feather: s.bgFx.feather||30, blur: s.bgFx.blur||0, zoom: s.bgFx.zoom||0, lightness: s.bgFx.lightness||0, saturation: s.bgFx.saturation||0, activeTab: o === 'radial' ? 'radialA' : 'rectA' };
            } else if (s.bgFx && s.bgFx.radial && !s.bgFx.radialA) {

                            try { await targetDirHandle.getFileHandle(finalName);
                                if (!window.confirm(`檔案 "${finalName}" 已經存在。\n\n按「確定」覆蓋舊檔。\n按「取消」自動另存新檔。`)) {
                                    const base = finalName.substring(0, finalName.lastIndexOf('.')); const ext = finalName.substring(finalName.lastIndexOf('.')); finalName = `${base}_${Math.floor(Date.now() / 1000).toString().slice(-4)}${ext}`;
                                }
                            } catch (e) {} 
                            const fileHandle = await targetDirHandle.getFileHandle(finalName, { create: true }); const writable = await fileHandle.createWritable(); await writable.write(blob); await writable.close();
                            btn.innerText = '✔ 儲存成功'; setTimeout(()=>btn.innerText='💾 存檔(高畫質)', 1500); return;
                        } catch (err) { showToast('寫入失敗'); }
                    }
                    if (window.showSaveFilePicker) {
                        try { const handle = await window.showSaveFilePicker({ id: 'pottery_app_save_dir', suggestedName: finalName, types: [{ description: 'JPEG 影像', accept: { 'image/jpeg': ['.jpg'] } }] });
                            const writable = await handle.createWritable(); await writable.write(blob); await writable.close(); btn.innerText = '✔ 儲存成功'; setTimeout(()=>btn.innerText='💾 存檔(高畫質)', 1500); return;
                        } catch (err) { return; }
                    }
                    const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = finalName; a.click(); URL.revokeObjectURL(url);
                }, 'image/jpeg', 0.95);
            }, 50);
        };

        initUI();
    </script>
</body>
</html>
